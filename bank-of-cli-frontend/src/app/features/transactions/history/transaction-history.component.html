<section>
  <h1>Transaction History</h1>
  <transaction-summary [numberOfTransactions]="transactions.length"></transaction-summary>
  <ul>
    @for (t of transactions; track t.id) {
      <li>
        <app-transaction-item
          [origin]="t.description ?? ''"
          [amount]="t.amount"
          [date]="t.date"
          [type]="t.type">
        </app-transaction-item>
      </li>
    } @empty {
      <li class="py-3 text-ink-muted">No transactions found.</li>
    }
  </ul>

  <p *ngIf="transactions.length === 0">No transactions found.</p>
</section>
